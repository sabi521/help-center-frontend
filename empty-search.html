<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empty Search List</title>
  </head>
  <body>
    <main class="bg-background-1 border-b-7 border-primary">
      <!--
        Breadcrumbs
        -->
      <section class="breadcrumb bg-inv-card-solid">
        <div
          class="max-w-[1430px] mx-auto px-6 py-4 flex items-center justify-between gap-4"
        >
          <p class="inline-flex gap-1 items-center">
            <a
              href="/"
              class="text-inv-link text-base font-['Roboto'] leading-6 line-clamp-1"
              >Help Center</a
            >
            <img src="breadcrumb-icon.svg" alt="breadcrumb icon" />
            <span
              class="text-inv-foreground-high text-base font-normal font-['Roboto'] leading-6 line-clamp-1"
              >Search Results</span
            >
          </p>

          <!-- Mobile search icon button -->
          <button
            type="button"
            id="openMobileSearch"
            class="md:hidden h-10 w-10 grid place-items-center rounded-full"
            aria-label="Open search"
          >
            <img src="search-icon-circle.svg" alt="" class="h-8 w-8" />
          </button>
        </div>

        <!-- Mobile overlay  -->
        <div
          id="mobileSearchOverlay"
          class="fixed md:relative inset-0 z-999 hidden md:block"
        >
          <div class="bg-inv-card-solid md:bg-background-1 px-4 py-3">
            <div class="flex items-center gap-3 max-w-170 mx-auto">
              <div
                class="flex h-11 flex-1 items-center gap-2 rounded-full bg-white px-4 outline transition-all md:rounded-[100px] has-[:focus]:outline-2 md:has-[:focus]:outline-1 has-[:focus]:outline-focus"
              >
                <img
                  src="search-normal.svg"
                  alt=""
                  class="h-3.5 w-3.5 md:h-5 md:w-5"
                />

                <input
                  id="mobileSearchInput"
                  type="text"
                  placeholder="Search"
                  class="w-full bg-transparent text-sm outline-none font-['Roboto'] font-normal leading-4 text-foreground-high"
                />

                <!-- Clear (X) -->
                <button
                  type="button"
                  id="mobileClearBtn"
                  class="hidden cursor-pointer"
                  aria-label="Clear search"
                >
                  <img
                    src="search-close.svg"
                    alt=""
                    class="h-5 w-5 md:h-8 md:w-8"
                  />
                </button>
              </div>

              <button
                type="button"
                id="closeMobileSearch"
                class="text-inv-foreground-high md:text-foreground-high text-xs font-semibold font-['Roboto'] leading-4 cursor-pointer"
              >
                Cancel
              </button>
            </div>

            <div id="firstSearch" class="hidden max-w-170 mx-auto">
              <div class="mt-4 flex items-center justify-between">
                <p
                  class="text-inv-foreground-medium md:text-foreground-medium text-sm font-semibold font-['Nexa'] leading-4"
                >
                  Your Recent Searches:
                </p>

                <button
                  type="button"
                  id="trashButton"
                  class="min-w-16 max-h-6 min-h-6 px-2.5 bg-fill-medium rounded-full inline-flex justify-center items-center gap-1 cursor-pointer"
                >
                  <img src="trash-black.svg" alt="" class="h-4 w-4" />
                  <span
                    class="text-foreground-high text-xs font-semibold font-['Nexa'] leading-4"
                    >Clear All</span
                  >
                </button>
              </div>

              <div
                id="recentChips"
                class="flex flex-nowrap gap-2 overflow-x-auto overflow-y-hidden scroll-smooth no-scrollbar"
              >
                <a
                  href="#"
                  class="chip mt-4 shrink-0 text-inv-foreground-high md:text-foreground-high text-sm font-semibold font-['Nexa'] leading-4 flex items-center gap-1"
                >
                  <span class="md:text-foreground-high">Deposit bonus</span>
                  <img
                    class="chip-close md:hidden"
                    src="chip-close-icon.svg"
                    alt="chip close"
                  />
                  <img
                    class="chip-close hidden md:block"
                    src="chip-close-dark-icon.svg"
                    alt="chip close"
                  />
                </a>

                <a
                  href="#"
                  class="chip mt-4 shrink-0 text-inv-foreground-high md:text-foreground-high text-sm font-semibold font-['Nexa'] leading-4 flex items-center gap-1"
                >
                  <span class="md:text-foreground-high">Bonus</span>
                  <img
                    class="chip-close md:hidden"
                    src="chip-close-icon.svg"
                    alt="chip close"
                  />
                  <img
                    class="chip-close hidden md:block"
                    src="chip-close-dark-icon.svg"
                    alt="chip close"
                  />
                </a>

                <a
                  href="#"
                  class="chip mt-4 shrink-0 text-inv-foreground-high text-sm font-semibold font-['Nexa'] leading-4 flex items-center gap-1"
                >
                  <span class="md:text-foreground-high">Crypto Bonus</span>
                  <img
                    class="chip-close md:hidden"
                    src="chip-close-icon.svg"
                    alt="chip close"
                  />
                  <img
                    class="chip-close hidden md:block"
                    src="chip-close-dark-icon.svg"
                    alt="chip close"
                  />
                </a>

                <a
                  href="#"
                  class="chip mt-4 shrink-0 text-inv-foreground-high text-sm font-semibold font-['Nexa'] leading-4 flex items-center gap-1"
                >
                  <span class="md:text-foreground-high">Deposit bonus</span>
                  <img
                    class="chip-close md:hidden"
                    src="chip-close-icon.svg"
                    alt="chip close"
                  />
                  <img
                    class="chip-close hidden md:block"
                    src="chip-close-dark-icon.svg"
                    alt="chip close"
                  />
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!--
        Search Bar on top ends
        -->

      <!--
         Search Results section starts
         -->
      <section
        class="search-result-section max-w-170 mb-10 mx-auto px-3 md:px-0"
      >
        <div class="flex flex-col gap-2 mb-6 mt-8">
          <span
            class="text-foreground-medium text-sm font-normal font-['Roboto'] leading-5"
          >
            0 Results for: “jhaskfhasf”
          </span>
        </div>
        <div
          class="px-5 py-6 bg-card-1 rounded-2xl flex flex-col justify-start items-center gap-6"
        >
          <div
            class="w-16 h-16 flex justify-center items-center bg-foreground-low/5 rounded-full"
          >
            <img src="empty-list.svg" alt="No results icon" class="w-16 h-16" />
          </div>

          <div
            class="max-w-lg w-full flex flex-col justify-start items-center gap-4"
          >
            <h3
              class="w-full text-center text-Button-txt-main-onLight text-2xl font-extrabold font-['Nexa'] leading-7"
            >
              No results for <span>“jhaskfhasf”</span>
            </h3>
            <p
              class="w-full text-center text-foreground-low text-base font-normal font-['Roboto'] leading-6"
            >
              Make sure all words are spelled correctly or try using synonyms.
            </p>
          </div>
        </div>
      </section>
      <!--
         Search Results section ends
         -->
    </main>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
